<!DOCTYPE html>

<!--
SIMPLE DEPLOYMENT: only index.html + database.rules.json.
1. Find window.FIREBASE_CONFIG below and fill your Firebase Web App config.
2. Enable Google and Email/Password in Firebase Authentication; disable email-link login.
3. Add your hosting domain to Authentication > Authorized domains.
4. Publish database.rules.json in Realtime Database > Rules.
5. Bootstrap the first administrator through Firebase Console > RTDB > Data:
   users / YOUR_EMAIL_WITH_DOTS_REPLACED_BY_COMMAS
   Record fields (replace email and name):
   {"Name":"Administrator","Email":"your-email@gmail.com","Role":"admin",
    "Active":true,"Plan":"Custom","PrivateGroups":"","SubStart":"2026-01-01",
    "SubEnd":"2099-12-31","StartsAt":0,"ExpiresAt":4102444800000}
   Example key: your-email@gmail,com. Use your actual lowercase Google email.
   Add this record only; do not replace an existing database root.
6. Host index.html on HTTPS. Uploading the rules file alone does not publish rules.
7. Sign in with Google, add users/apps and use Assign Apps.
8. Password policy: Require, length 12 to 128, uppercase/lowercase/numeric/special.
   Portal forms additionally require at least two characters in each category.
Firebase/React SDKs still load over the internet. No build tools are required.
No portal verification/reset emails are sent. Recovery uses Google sign-in.
-->
