<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Private Webapp Portal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        
        // --- 🔴 BULLETPROOF ICON FIX 🔴 ---
        // Instead of relying on a CDN that might fail or get blocked, 
        // we define the exact SVG paths for the icons used in the app directly.
        const Icon = ({ children, className = "", size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const LayoutDashboard = (p) => <Icon {...p}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Icon>;
        const Users = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
        const PlusSquare = (p) => <Icon {...p}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></Icon>;
        const LogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Icon>;
        const Code = (p) => <Icon {...p}><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></Icon>;
        const AlertCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
        const CheckCircle2 = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>;
        const CheckCircle = CheckCircle2;
        const Shield = (p) => <Icon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></Icon>;
        const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
        const RefreshCw = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></Icon>;
        const Menu = (p) => <Icon {...p}><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></Icon>;
        const Bot = (p) => <Icon {...p}><rect width="18" height="14" x="3" y="8" rx="2"/><path d="M12 5a3 3 0 1 0-3 3"/><line x1="9" y1="13" x2="9.01" y2="13"/><line x1="15" y1="13" x2="15.01" y2="13"/></Icon>;
        const Send = (p) => <Icon {...p}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></Icon>;
        const Mail = (p) => <Icon {...p}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></Icon>;
        const KeyRound = (p) => <Icon {...p}><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></Icon>;
        const Fingerprint = (p) => <Icon {...p}><path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M11.5 4A8.5 8.5 0 0 0 6 10.5"/><path d="M15.5 4A8.5 8.5 0 0 1 21 10.5"/><path d="M8 15a4 4 0 0 1 8 0v2"/><path d="M12 9a2 2 0 0 1 2 2v2"/><path d="M16 19.5c0-1.5.5-3 1.5-4.5"/></Icon>;
        const Sparkles = (p) => <Icon {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></Icon>;
        const Building2 = (p) => <Icon {...p}><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></Icon>;
        const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"/></Icon>;
        const LayoutTemplate = (p) => <Icon {...p}><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/></Icon>;
        const Info = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></Icon>;
        const Phone = (p) => <Icon {...p}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></Icon>;
        const Instagram = (p) => <Icon {...p}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></Icon>;
        const Code2 = (p) => <Icon {...p}><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></Icon>;
        const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
        const UserPlus = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></Icon>;
        const Edit2 = (p) => <Icon {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></Icon>;
        const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
        const Folder = (p) => <Icon {...p}><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></Icon>;
        const Lock = (p) => <Icon {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
        const UploadCloud = (p) => <Icon {...p}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></Icon>;
        const Crown = (p) => <Icon {...p}><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></Icon>;
        const ChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9"/></Icon>;
        const Sun = (p) => <Icon {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></Icon>;
        const Moon = (p) => <Icon {...p}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></Icon>;

        // ⚠️ UPDATE THIS URL TO YOUR NEW VISION 2 DEPLOYMENT URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxqpA5bNK_oEYjFyt48zHc4YGydiRAo3PIUvCI-dBv6opNipgE8ih0S4foUuoYWD5yfHw/exec'; 

        function Vision2App() {
          // Data States
          const [portalUser, setPortalUser] = useState(null);
          const [usersList, setUsersList] = useState([]);
          const [appsList, setAppsList] = useState([]);
          const [projectsList, setProjectsList] = useState([]);
          const [isLoading, setIsLoading] = useState(false);
          
          // UI States
          const [emailInput, setEmailInput] = useState('');
          const [otpInput, setOtpInput] = useState('');
          const [step, setStep] = useState(1);
          const [notification, setNotification] = useState(null);
          const [activeTab, setActiveTab] = useState('dashboard');
          const [openCategories, setOpenCategories] = useState({});
          const [sidebarTheme, setSidebarTheme] = useState('dark');
          const [isSidebarOpen, setIsSidebarOpen] = useState(true);

          // Modals
          const [showInfoModal, setShowInfoModal] = useState(false);
          const [showAddUserModal, setShowAddUserModal] = useState(false);
          const [showEditUserModal, setShowEditUserModal] = useState(false);

          // Forms
          const [newApp, setNewApp] = useState({ title: '', category: 'General', requiredPlan: 'Basic', price: 'Free', features: '', demoUrl: '', content: '' });
          const [newUser, setNewUser] = useState({ name: '', email: '', role: 'user', plan: 'Basic', privateGroups: '', subStart: new Date().toISOString().split('T')[0], subEnd: new Date(new Date().setMonth(new Date().getMonth() + 1)).toISOString().split('T')[0] });
          const [editingUser, setEditingUser] = useState(null);

          // Project Forms
          const [customProject, setCustomProject] = useState({ phone: '', requirements: '', fileBase64: '', fileName: '', mimeType: '' });
          const [isSubmittingProject, setIsSubmittingProject] = useState(false);
          const [projectSuccess, setProjectSuccess] = useState(false);
          const fileInputRef = useRef(null);

          // Admin Reply Form
          const [replyingProject, setReplyingProject] = useState(null);
          const [replyData, setReplyData] = useState({ status: 'Open', replyMsg: '' });

          // Utility Functions
          const showNotification = (message, type = 'info') => {
            setNotification({ message, type });
            setTimeout(() => setNotification(null), 5000);
          };

          const getSheetVal = (obj, keyName) => {
            if (!obj) return null;
            const targetKey = keyName.toLowerCase().replace(/[^a-z0-9]/g, '');
            const foundKey = Object.keys(obj).find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === targetKey);
            return foundKey && obj[foundKey] && obj[foundKey].toString().trim() !== '' ? obj[foundKey] : null;
          };

          const calculateDaysRemaining = (endDateStr) => {
            if (!endDateStr) return 0;
            const diffTime = new Date(endDateStr).setHours(0,0,0,0) - new Date().setHours(0,0,0,0);
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          };

          const formatDisplayDate = (dateStr) => {
            if (!dateStr) return 'N/A';
            try {
              const d = new Date(dateStr);
              if (isNaN(d.getTime())) return dateStr;
              const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
              return `${d.getDate().toString().padStart(2, '0')}-${months[d.getMonth()]}-${d.getFullYear()}`;
            } catch (e) { return dateStr; }
          };

          // API Fetch - Fixed Redirects for Google Apps Script
          const fetchFromSheet = useCallback(async (action, payload = null) => {
            try {
              if (action === 'get_data') {
                const response = await fetch(`${SCRIPT_URL}?action=get_data&t=${new Date().getTime()}`, {
                    method: 'GET',
                    redirect: 'follow'
                });
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                return await response.json();
              } else {
                const response = await fetch(SCRIPT_URL, {
                  method: 'POST',
                  redirect: 'follow',
                  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                  body: JSON.stringify({ action, ...payload })
                });
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                return await response.json();
              }
            } catch (error) {
              console.error("API Error:", error);
              showNotification(`Database Error: Failed to fetch. Make sure the Google App Script is deployed to 'Anyone'.`, 'error');
              return null;
            }
          }, []);

          const loadData = useCallback(async () => {
            setIsLoading(true);
            const data = await fetchFromSheet('get_data');
            if (data) {
              setUsersList(data.users || []);
              setAppsList(data.apps || []);
              setProjectsList(data.projects || []); 
            }
            setIsLoading(false);
          }, [fetchFromSheet]);

          useEffect(() => { loadData(); }, [loadData]);

          // LOGIN LOGIC
          const handleSendOtp = async (e) => {
            e.preventDefault();
            const userDoc = usersList.find(u => u.Email?.toString().toLowerCase() === emailInput.toLowerCase());
            if (!userDoc) return showNotification('This email is not registered in the system.', 'error');

            setIsLoading(true);
            const generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
            const timestamp = Date.now();
            const result = await fetchFromSheet('update_otp', { email: emailInput, otp: generatedOtp, timestamp });
            setIsLoading(false);

            if (result && result.success) {
              setUsersList(prev => prev.map(u => u.Email.toLowerCase() === emailInput.toLowerCase() ? { ...u, OTP: generatedOtp, OTPTimestamp: timestamp } : u));
              setStep(2);
              showNotification(`A secure OTP has been sent to your registered email address.`, 'success');
            } else {
              showNotification(result?.error || 'Failed to send OTP.', 'error');
            }
          };

          const handleVerifyOtp = async (e) => {
            e.preventDefault();
            const userDoc = usersList.find(u => u.Email?.toLowerCase() === emailInput.toLowerCase());
            if (!userDoc) return;
            if (userDoc.OTP?.toString() !== otpInput.toString()) return showNotification('Invalid OTP entered.', 'error');
            if (Date.now() - (parseInt(userDoc.OTPTimestamp) || 0) > 300000) { 
              setStep(1); return showNotification('OTP expired. Request a new one.', 'error'); 
            }
            if (calculateDaysRemaining(userDoc.SubEnd) <= 0) return showNotification('Plan Expired. Purchase Credits.', 'error');

            setPortalUser(userDoc);
            setActiveTab('dashboard');
            setIsSidebarOpen(true); 
            setShowInfoModal(true); 
            showNotification('Logged in successfully!', 'success');
          };

          const handleLogout = () => { setPortalUser(null); setStep(1); setEmailInput(''); setOtpInput(''); };

          // ADMIN LOGIC
          const handleAddNewApp = async (e) => {
            e.preventDefault();
            setIsLoading(true);
            const result = await fetchFromSheet('add_app', newApp);
            if (result && result.success) {
              setNewApp({ title: '', category: 'General', requiredPlan: 'Basic', price: 'Free', features: '', demoUrl: '', content: '' });
              await loadData();
              showNotification('WebApp added successfully!', 'success');
            } else showNotification(result?.error || 'Failed to add app.', 'error');
            setIsLoading(false);
          };

          const handleUserAction = async (actionStr, payload, closeFormFunc) => {
            setIsLoading(true);
            const result = await fetchFromSheet(actionStr, payload);
            if (result && result.success) {
              if(closeFormFunc) closeFormFunc();
              await loadData();
              showNotification(`Success!`, 'success');
            } else showNotification(result?.error || 'Error executing action.', 'error');
            setIsLoading(false);
          };

          const handleFileChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              if (file.size > 3 * 1024 * 1024) return showNotification('File size must be less than 3MB', 'error');
              const reader = new FileReader();
              reader.onload = () => setCustomProject({ ...customProject, fileBase64: reader.result.split(',')[1], fileName: file.name, mimeType: file.type });
              reader.readAsDataURL(file);
            }
          };

          const handleCustomProjectSubmit = async (e) => {
            e.preventDefault();
            setIsSubmittingProject(true);
            const result = await fetchFromSheet('submit_custom_project', {
              name: portalUser.Name, email: portalUser.Email, phone: customProject.phone, requirements: customProject.requirements, fileBase64: customProject.fileBase64, fileName: customProject.fileName, mimeType: customProject.mimeType
            });
            setIsSubmittingProject(false);
            
            if (result && result.success) {
              setProjectSuccess(true);
              setCustomProject({ phone: '', requirements: '', fileBase64: '', fileName: '', mimeType: '' });
              if(fileInputRef.current) fileInputRef.current.value = "";
              setTimeout(() => setProjectSuccess(false), 5000);
            } else showNotification(result?.error || 'Failed to submit request.', 'error');
          };

          const handleAdminReplySubmit = async (e) => {
            e.preventDefault();
            setIsLoading(true);
            const result = await fetchFromSheet('admin_reply_project', {
              id: replyingProject.Id,
              status: replyData.status,
              replyMsg: replyData.replyMsg
            });
            setIsLoading(false);
            
            if (result && result.success) {
              setReplyingProject(null);
              setReplyData({ status: 'Open', replyMsg: '' });
              await loadData();
              showNotification('Reply sent and ticket updated!', 'success');
            } else {
              showNotification(result?.error || 'Failed to send reply.', 'error');
            }
          };

          // HELPERS & CONSTANTS
          const isAdmin = portalUser?.Role?.toLowerCase() === 'admin';
          const isDark = sidebarTheme === 'dark';

          const groupedApps = appsList.reduce((acc, app) => {
            const cat = getSheetVal(app, 'category') || 'Other Apps';
            if (!acc[cat]) acc[cat] = [];
            acc[cat].push(app);
            return acc;
          }, {});

          const uniqueCategories = Object.keys(groupedApps);

          const visibleCategories = uniqueCategories.filter(category => {
            if (isAdmin) return true;
            const userPrivGroups = (getSheetVal(portalUser, 'privategroups') || '').toLowerCase();
            const allowedGroups = userPrivGroups.split(',').map(s => s.trim()).filter(Boolean);
            return allowedGroups.includes(category.toLowerCase());
          });

          const hasAccessToApp = (appRequiredPlan, appCategory) => {
            if (isAdmin) return true;
            
            const userPrivGroups = (getSheetVal(portalUser, 'privategroups') || '').toLowerCase();
            const allowedGroups = userPrivGroups.split(',').map(s => s.trim()).filter(Boolean);
            const hasGroupAccess = appCategory && allowedGroups.includes(appCategory.toLowerCase());
            
            if (!hasGroupAccess) return false;

            if (appRequiredPlan?.toLowerCase() === 'vip') {
              if (portalUser.Plan?.toLowerCase() === 'vip' || portalUser.Plan?.toLowerCase() === 'custom') return true;
              return false;
            }

            return true;
          };

          const toggleCategory = (cat) => {
            setOpenCategories(prev => ({ ...prev, [cat]: prev[cat] === false ? true : false }));
          };

          // COMPONENTS
          const Toast = () => notification && (
            <div className={`fixed top-4 right-4 p-4 rounded-lg shadow-lg max-w-sm flex items-start gap-3 transition-all z-[150] ${notification.type === 'error' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}`}>
              {notification.type === 'error' ? <AlertCircle className="w-5 h-5 mt-0.5 flex-shrink-0" /> : <CheckCircle2 className="w-5 h-5 mt-0.5 flex-shrink-0" />}
              <p className="font-medium text-sm">{notification.message}</p>
            </div>
          );

          const AppInfoModal = () => showInfoModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                <div className="relative pt-8 pb-4 px-6 flex flex-col items-center border-b border-gray-100">
                  <button onClick={() => setShowInfoModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><X className="w-5 h-5" /></button>
                  <div className="w-16 h-16 rounded-full border-[3px] border-emerald-500 flex items-center justify-center mb-4 bg-emerald-50"><span className="text-3xl font-serif font-bold text-emerald-500 italic">i</span></div>
                  <h2 className="text-2xl font-bold text-slate-800">Contact Support</h2>
                  <p className="text-sm text-slate-500 text-center mt-1">Upgrade your plan or resolve login issues</p>
                </div>
                <div className="p-6">
                  <div className="bg-emerald-50 rounded-xl p-4 flex items-center gap-4 mb-6 border border-emerald-100">
                    <div className="text-emerald-600 font-bold bg-white p-2 rounded-lg shadow-sm"><Code2 className="w-6 h-6" /></div>
                    <div>
                      <p className="text-xs font-bold text-emerald-600 tracking-wider uppercase">Developed By</p>
                      <p className="text-lg font-bold text-slate-900 leading-tight">Ambuj Garg</p>
                    </div>
                  </div>
                  <div className="space-y-4 px-2 mb-8">
                    <div className="flex items-center gap-4 text-slate-600"><Phone className="w-5 h-5 text-emerald-500" /><span className="font-medium">7017024586</span></div>
                    <div className="flex items-center gap-4 text-slate-600"><Mail className="w-5 h-5 text-emerald-500" /><span className="font-medium">smsales@shrimasha.com</span></div>
                    <div className="flex items-center gap-4 text-slate-600"><Instagram className="w-5 h-5 text-pink-500" /><span className="font-medium">@Ambujgarg_official</span></div>
                  </div>
                  <button onClick={() => setShowInfoModal(false)} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl transition-all shadow-md">Close Panel</button>
                </div>
              </div>
            </div>
          );

          // RENDER LOGIN
          if (!portalUser) {
            return (
              <div className="flex min-h-screen bg-white relative">
                <Toast /> <AppInfoModal />

                                        <button key={app.Id || app.Title} onClick={() => setActiveTab(app.Id || app.Title)} className={`w-full flex items-center justify-between px-4 py-2 text-sm transition-colors ${isActive ? (isDark ? 'text-emerald-400 bg-slate-800 font-medium' : 'text-emerald-700 bg-emerald-50 font-medium') : (isDark ? 'text-slate-400 hover:text-white hover:bg-slate-800' : 'text-slate-500 hover:text-emerald-700 hover:bg-gray-50')}`}>
                                          <span className="truncate pr-2">{app.Title}</span>
                                          {reqPlan?.toLowerCase() === 'vip' && portalUser.Plan?.toLowerCase() !== 'vip' && portalUser.Plan?.toLowerCase() !== 'custom' && !isAdmin && <Lock className="w-3 h-3 text-amber-500 flex-shrink-0" title="Premium App"/>}
                                        </button>
                                      );
                                    })}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {isAdmin && (
                      <div className="px-3 mt-6 mb-2">
                        <div className={`text-xs font-bold uppercase tracking-wider mb-2 px-2 ${isDark ? 'text-slate-500' : 'text-slate-400'}`}>Admin Tools</div>
                        <div className="space-y-1">
                          <button onClick={() => { loadData(); setActiveTab('admin-users'); }} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg ${activeTab === 'admin-users' ? (isDark ? 'bg-slate-700 text-white' : 'bg-emerald-600 text-white shadow-md') : (isDark ? 'hover:bg-slate-800' : 'hover:bg-emerald-50 hover:text-emerald-700')}`}><Users className={`w-5 h-5 flex-shrink-0 ${activeTab !== 'admin-users' && !isDark && 'text-slate-400'}`}/><span>Manage Users</span></button>
                          <button onClick={() => setActiveTab('admin-apps')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg ${activeTab === 'admin-apps' ? (isDark ? 'bg-slate-700 text-white' : 'bg-emerald-600 text-white shadow-md') : (isDark ? 'hover:bg-slate-800' : 'hover:bg-emerald-50 hover:text-emerald-700')}`}><PlusSquare className={`w-5 h-5 flex-shrink-0 ${activeTab !== 'admin-apps' && !isDark && 'text-slate-400'}`}/><span>Add App/Tool</span></button>
                        </div>
                      </div>
                    )}
                    
                  </div>
                  
                  <div className={`border-t flex-shrink-0 ${isDark ? 'border-slate-800' : 'border-gray-200'}`}>
                    <div className="px-3 py-4">
                      <div className={`text-[10px] font-bold uppercase tracking-wider mb-1.5 px-2 flex items-center gap-1 ${isDark ? 'text-emerald-400' : 'text-emerald-600'}`}>
                        <Sparkles className="w-3 h-3 flex-shrink-0" /> Need Custom App?
                      </div>
                      <button onClick={() => setActiveTab('custom-project')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all border ${activeTab === 'custom-project' ? (isDark ? 'bg-slate-800 border-slate-700 text-white' : 'bg-emerald-600 border-emerald-500 text-white shadow-md') : (isDark ? 'border-slate-700/50 bg-slate-800/30 hover:bg-slate-800 text-slate-300' : 'border-emerald-100 bg-emerald-50/30 hover:bg-emerald-50 text-slate-600 hover:text-emerald-700')}`}>
                        <Code2 className={`w-5 h-5 flex-shrink-0 ${activeTab === 'custom-project' ? 'text-white' : (isDark ? 'text-emerald-400' : 'text-emerald-500')}`}/>
                        <span className="font-medium">{isAdmin ? 'Ticket Dashboard' : 'Custom Projects'}</span>
                      </button>
                    </div>

                    {isDark ? (
                      <div className="p-4 bg-slate-950">
                        <button onClick={handleLogout} className="w-full flex justify-center gap-2 px-4 py-2 bg-red-500/10 text-red-400 hover:bg-red-500/20 rounded-lg transition-colors font-medium"><LogOut className="w-4 h-4 flex-shrink-0"/><span>Log Out</span></button>
                      </div>
                    ) : (
                      <div className="px-4 pb-4">
                        <button onClick={handleLogout} className="w-full flex justify-center gap-2 px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg transition-colors font-medium text-sm">
                          <LogOut className="w-4 h-4 flex-shrink-0"/><span>Log Out</span>
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* Main Content Area */}
              <div className="flex-1 flex flex-col h-full min-w-0 bg-slate-50 relative z-10">
                <header className="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 sm:px-6 shadow-sm flex-shrink-0">
                  <div className="flex items-center gap-3 min-w-0">
                    {!isSidebarOpen && <button onClick={() => setIsSidebarOpen(true)} className="p-1.5 -ml-2 text-gray-600 hover:bg-gray-100 rounded-lg flex-shrink-0"><Menu className="w-6 h-6" /></button>}
                    <h2 className={`text-xl font-bold text-gray-800 truncate ${!isSidebarOpen?'ml-2':''}`}>
                      {activeTab === 'dashboard' && 'Welcome Dashboard'}
                      {activeTab === 'custom-project' && (isAdmin ? 'Manage Custom Tickets' : 'Request Custom App')}
                      {activeTab === 'admin-users' && 'Users Management'}
                      {activeTab === 'admin-apps' && 'App Setup'}
                      {isViewingApp && activeAppObj.Title}
                    </h2>
                    {isLoading && <RefreshCw className="w-4 h-4 text-emerald-500 animate-spin flex-shrink-0" />}
                  </div>
                  <div className="flex items-center gap-3 flex-shrink-0">
                    <button onClick={() => setSidebarTheme(isDark ? 'light' : 'dark')} className="p-2 text-gray-400 hover:text-amber-500 hover:bg-amber-50 rounded-full transition-colors" title="Toggle Theme">
                      {isDark ? <Sun className="w-5 h-5 flex-shrink-0" /> : <Moon className="w-5 h-5 flex-shrink-0" />}
                    </button>
                    <button onClick={() => setShowInfoModal(true)} className="p-2 text-gray-400 hover:text-blue-500 hover:bg-blue-50 rounded-full"><Info className="w-5 h-5 flex-shrink-0" /></button>
                    <button onClick={loadData} title="Refresh Data from Sheet" className="p-2 text-gray-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-full transition-colors"><RefreshCw className="w-5 h-5 flex-shrink-0" /></button>
                    <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-medium bg-green-50 border border-green-200 text-green-700"><Clock className="w-4 h-4 flex-shrink-0" /><span>{calculateDaysRemaining(portalUser.SubEnd)} Days</span></div>
                    <div className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold flex-shrink-0">{portalUser.Name?.charAt(0)}</div>
                  </div>
                </header>

                <main className="flex-1 overflow-auto relative">
                  
                  {activeTab === 'dashboard' && (
                    <div className="p-6 max-w-4xl mx-auto space-y-6">
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <div className="flex justify-between items-start mb-6">
                          <h3 className="text-lg font-semibold text-gray-800">Your Subscription</h3>
                          <span className={`px-3 py-1 rounded-full text-sm font-bold ${portalUser.Plan === 'VIP' ? 'bg-amber-100 text-amber-700 border border-amber-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                            {portalUser.Plan || 'Basic'} Plan
                          </span>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                          <div className="p-4 bg-gray-50 rounded-lg"><p className="text-xs text-gray-500">Name</p><p className="font-semibold">{portalUser.Name}</p></div>
                          <div className="p-4 bg-gray-50 rounded-lg"><p className="text-xs text-gray-500">Email</p><p className="font-semibold truncate">{portalUser.Email}</p></div>
                          <div className="p-4 bg-gray-50 rounded-lg"><p className="text-xs text-gray-500">Start Date</p><p className="font-semibold">{formatDisplayDate(portalUser.SubStart)}</p></div>
                          <div className="p-4 bg-gray-50 rounded-lg"><p className="text-xs text-gray-500">Valid Till</p><p className="font-semibold">{formatDisplayDate(portalUser.SubEnd)}</p></div>
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === 'custom-project' && (
                    <div className={`p-6 mx-auto ${isAdmin ? 'max-w-6xl' : 'max-w-2xl'}`}>
                      {isAdmin ? (
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                          <div className="p-6 border-b border-gray-200 bg-gray-50">
                             <h2 className="text-xl font-bold text-gray-800">Custom Project Requests</h2>
                             <p className="text-gray-500 text-sm">Manage client requests, update status, and send email replies.</p>
                          </div>
                          <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                              <thead className="bg-white text-gray-400 font-bold uppercase text-[10px] tracking-wider border-b border-gray-200">
                                <tr><th className="px-6 py-4">Client Details</th><th className="px-6 py-4">Status</th><th className="px-6 py-4">Submitted On</th><th className="px-6 py-4 text-center">Action</th></tr>
                              </thead>
                              <tbody className="divide-y divide-gray-100">
                                {projectsList.length > 0 ? projectsList.slice().reverse().map((p, i) => (
                                  <tr key={p.Id || i} className="hover:bg-gray-50/50 transition-colors">
                                    <td className="px-6 py-4">
                                      <p className="font-bold text-gray-900">{getSheetVal(p, 'username')}</p>
                                      <div className="flex flex-col mt-0.5"><span className="text-gray-500">{getSheetVal(p, 'useremail')}</span><span className="text-xs text-gray-400">{getSheetVal(p, 'userphone')}</span></div>
                                    </td>
                                    <td className="px-6 py-4">
                                      <span className={`px-3 py-1 rounded-full text-xs font-bold border ${getSheetVal(p, 'status') === 'Closed' ? 'bg-gray-50 text-gray-500 border-gray-200' : getSheetVal(p, 'status') === 'In Progress' ? 'bg-blue-50 text-blue-600 border-blue-200' : 'bg-amber-50 text-amber-600 border-amber-200'}`}>
                                        {getSheetVal(p, 'status') || 'Open'}
                                      </span>
                                    </td>
                                    <td className="px-6 py-4 text-gray-500 font-medium">{formatDisplayDate(getSheetVal(p, 'createdat'))}</td>
                                    <td className="px-6 py-4 flex justify-center">
                                      <button onClick={() => { setReplyingProject(p); setReplyData({ status: getSheetVal(p, 'status') || 'Open', replyMsg: '' }); }} className="px-4 py-2 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors border border-emerald-200">
                                        <Mail className="w-4 h-4 flex-shrink-0" /> View & Reply
                                      </button>
                                    </td>
                                  </tr>
                                )) : (
                                  <tr><td colSpan="4" className="px-6 py-12 text-center text-gray-400 font-medium">No custom project requests found in database.</td></tr>
                                )}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      ) : (
                        projectSuccess ? (
                          <div className="bg-green-50 border border-green-200 rounded-2xl p-8 text-center animate-in fade-in zoom-in">
                            <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4"><CheckCircle className="w-8 h-8 flex-shrink-0"/></div>
                            <h2 className="text-2xl font-bold text-green-800 mb-2">Submitted, Thanks!</h2>
                            <p className="text-green-600">We will review your requirements and get back to you shortly.</p>
                            <button onClick={() => setProjectSuccess(false)} className="mt-6 px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Submit Another</button>
                          </div>
                        ) : (
                          <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                            <div className="mb-6"><h2 className="text-xl font-bold text-gray-800">Request Custom Application</h2><p className="text-gray-500 text-sm">Tell us what you want to build. We will create a tailored solution for you.</p></div>
                            <form onSubmit={handleCustomProjectSubmit} className="space-y-4">
                              <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Name</label><input type="text" disabled value={portalUser.Name} className="w-full px-4 py-2.5 bg-gray-100 border border-gray-200 rounded-lg text-gray-600 cursor-not-allowed" /></div>
                                <div><label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Email</label><input type="email" disabled value={portalUser.Email} className="w-full px-4 py-2.5 bg-gray-100 border border-gray-200 rounded-lg text-gray-600 cursor-not-allowed" /></div>
                              </div>
                              <div>
                                <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">WhatsApp / Phone Number</label>
                                <input required type="tel" value={customProject.phone} onChange={e => setCustomProject({...customProject, phone: e.target.value})} className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="+91 XXXXX XXXXX" />
                              </div>
                              <div>
                                <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Project Requirements</label>
                                <textarea required rows="5" value={customProject.requirements} onChange={e => setCustomProject({...customProject, requirements: e.target.value})} className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none resize-none" placeholder="Describe the app you want to build, features needed, etc."></textarea>
                              </div>
                              <div>
                                <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Attach File / Screenshot (Max 3MB)</label>
                                <div className="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center hover:bg-gray-50 transition-colors">
                                  <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" id="file-upload" accept="image/*,.pdf,.doc,.docx" />
                                  <label htmlFor="file-upload" className="cursor-pointer flex flex-col items-center justify-center">
                                    <UploadCloud className="w-8 h-8 text-emerald-400 mb-2 flex-shrink-0" />
                                    <span className="text-sm text-emerald-600 font-medium">{customProject.fileName ? customProject.fileName : 'Click to select a file'}</span>
                                    {!customProject.fileName && <span className="text-xs text-gray-400 mt-1">PDF, JPG, PNG allowed</span>}
                                  </label>
                                </div>
                              </div>
                              <button type="submit" disabled={isSubmittingProject} className="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-emerald-400 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 shadow-md">
                                {isSubmittingProject ? <><RefreshCw className="w-5 h-5 animate-spin flex-shrink-0"/> Sending Request...</> : <><Send className="w-5 h-5 flex-shrink-0"/> Submit Request</>}
                              </button>
                            </form>
                          </div>
                        )
                      )}
                    </div>
                  )}

                  {isViewingApp && (
                    hasAppAccess ? (
                      <div className="absolute inset-0 bg-slate-100 flex flex-col z-0">
                        <iframe title="App Render" srcDoc={getSheetVal(activeAppObj, 'content') || activeAppObj.Content} className="w-full flex-1 border-none" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" />
                      </div>
                    ) : (
                      <div className="p-6 max-w-3xl mx-auto h-full flex flex-col items-center justify-center">
                        <div className="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden w-full text-center p-10 relative">
                          <div className="absolute top-0 inset-x-0 h-2 bg-gradient-to-r from-amber-400 to-orange-500"></div>
                          <div className="w-20 h-20 bg-amber-50 rounded-full flex items-center justify-center mx-auto mb-6"><Crown className="w-10 h-10 text-amber-500 flex-shrink-0" /></div>
                          <h2 className="text-3xl font-extrabold text-gray-900 mb-2">{activeAppObj.Title}</h2>
                          <p className="text-amber-600 font-bold tracking-widest uppercase text-sm mb-6">Premium Application</p>
                          
                          <div className="bg-gray-50 border border-gray-100 rounded-xl p-6 text-left mb-8 max-w-lg mx-auto">
                            <h4 className="font-bold text-gray-700 mb-4 border-b pb-2">Key Features</h4>
                            <ul className="space-y-3">
                              {appFeaturesText.split('\n').map((feature, idx) => (
                                <li key={idx} className="flex items-start gap-3"><CheckCircle2 className="w-5 h-5 text-green-500 flex-shrink-0" /><span className="text-gray-600 text-sm font-medium">{feature}</span></li>
                              ))}
                            </ul>
                          </div>

                          <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                            {appDemoUrl && (
                              <a href={appDemoUrl} target="_blank" rel="noreferrer" className="w-full sm:w-auto px-8 py-3.5 bg-white border-2 border-slate-200 text-slate-700 hover:border-emerald-500 hover:text-emerald-600 font-bold rounded-xl transition-all flex items-center justify-center gap-2">
                                View Demo / Details
                              </a>
                            )}
                            <button onClick={() => setShowInfoModal(true)} className="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                              <Lock className="w-5 h-5 flex-shrink-0" /> Upgrade Plan ({appPrice})
                            </button>
                          </div>
                          <p className="mt-6 text-sm text-gray-400 font-medium">Not included in your current '{portalUser.Plan || 'Basic'}' plan.</p>
                        </div>
                      </div>
                    )
                  )}

                  {activeTab === 'admin-users' && isAdmin && (
                    <div className="p-6 max-w-6xl mx-auto space-y-4">
                      <div className="flex justify-end"><button onClick={() => setShowAddUserModal(true)} className="bg-emerald-600 text-white py-2 px-4 rounded-lg flex gap-2 hover:bg-emerald-700 transition-colors font-bold"><UserPlus className="w-5 h-5 flex-shrink-0" /> Add User</button></div>
                      <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                          <thead className="bg-gray-50 text-gray-600 font-medium border-b border-gray-200">
                            <tr><th className="px-4 py-3">User Name</th><th className="px-4 py-3">Email Id</th><th className="px-4 py-3">Plan</th><th className="px-4 py-3">Private Access</th><th className="px-4 py-3 text-center">Days</th><th className="px-4 py-3 text-center">Actions</th></tr>
                          </thead>
                          <tbody className="divide-y divide-gray-100">
                            {usersList.map((u, i) => {
                              const uPlan = getSheetVal(u, 'plan') || 'Basic';
                              const uPriv = getSheetVal(u, 'privategroups') || '-';
                              const uSubStart = getSheetVal(u, 'substart');
                              const uSubEnd = getSheetVal(u, 'subend');
                              const uName = getSheetVal(u, 'name');
                              const uEmail = getSheetVal(u, 'email');
                              const uRole = getSheetVal(u, 'role');
                              
                              return (
                                <tr key={u.Id || i} className="hover:bg-gray-50">
                                  <td className="px-4 py-3 font-medium text-gray-900">{uName}</td>
                                  <td className="px-4 py-3 text-gray-600">{uEmail}</td>
                                  <td className="px-4 py-3"><span className="px-2 py-1 rounded text-xs font-bold bg-emerald-50 text-emerald-700">{uPlan}</span></td>
                                  <td className="px-4 py-3 text-xs text-gray-500 font-medium max-w-[150px] truncate" title={uPriv}>{uPriv}</td>
                                  <td className="px-4 py-3 text-center font-bold text-green-600">{calculateDaysRemaining(uSubEnd)}</td>
                                  <td className="px-4 py-3 flex justify-center gap-3">
                                    <button onClick={() => { setEditingUser({id: u.Id, name: uName, email: uEmail, role: uRole, plan: uPlan, privateGroups: getSheetVal(u, 'privategroups') || '', subStart: uSubStart?.split('T')[0], subEnd: uSubEnd?.split('T')[0]}); setShowEditUserModal(true); }} className="text-blue-500 hover:bg-blue-50 p-1.5 rounded"><Edit2 className="w-4 h-4 flex-shrink-0"/></button>
                                    <button onClick={() => { if(window.confirm('Delete user?')) handleUserAction('delete_user', {id: u.Id}) }} className="text-red-500 hover:bg-red-50 p-1.5 rounded"><Trash2 className="w-4 h-4 flex-shrink-0"/></button>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {activeTab === 'admin-apps' && isAdmin && (
                    <div className="p-6 max-w-3xl mx-auto">
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <h3 className="text-lg font-bold text-gray-800 mb-6 border-b pb-2">Add New App to Marketplace</h3>
                        <form onSubmit={handleAddNewApp} className="space-y-4">
                          <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-sm font-semibold mb-1">App Title</label><input required type="text" value={newApp.title} onChange={e=>setNewApp({...newApp, title: e.target.value})} className="w-full px-3 py-2 border rounded-md" /></div>
                            <div><label className="block text-sm font-semibold mb-1">Group / Category</label><input required type="text" placeholder="e.g. Disha Group" value={newApp.category} onChange={e=>setNewApp({...newApp, category: e.target.value})} className="w-full px-3 py-2 border rounded-md" /></div>
                          </div>
                          <div className="grid grid-cols-2 gap-4">
                            <div>
                              <label className="block text-sm font-semibold mb-1">Required Plan</label>
                              <select value={newApp.requiredPlan} onChange={e=>setNewApp({...newApp, requiredPlan: e.target.value})} className="w-full px-3 py-2 border rounded-md">
                                <option value="Basic">Basic (Free for all)</option>
                                <option value="VIP">VIP (Premium Only)</option>
                              </select>
                            </div>
                            <div><label className="block text-sm font-semibold mb-1">Price Label (e.g. ₹500/mo)</label><input type="text" value={newApp.price} onChange={e=>setNewApp({...newApp, price: e.target.value})} className="w-full px-3 py-2 border rounded-md" /></div>
                          </div>
                          <div><label className="block text-sm font-semibold mb-1">Demo / PDF URL (For Preview)</label><input type="url" placeholder="https://youtube.com/..." value={newApp.demoUrl} onChange={e=>setNewApp({...newApp, demoUrl: e.target.value})} className="w-full px-3 py-2 border rounded-md" /></div>
                          <div><label className="block text-sm font-semibold mb-1">Key Features (One per line)</label><textarea rows="3" placeholder="Feature 1&#10;Feature 2" value={newApp.features} onChange={e=>setNewApp({...newApp, features: e.target.value})} className="w-full px-3 py-2 border rounded-md"></textarea></div>
                          <div><label className="block text-sm font-semibold mb-1">App Code (Raw HTML)</label><textarea required rows="6" value={newApp.content} onChange={e=>setNewApp({...newApp, content: e.target.value})} className="w-full px-3 py-2 border rounded-md font-mono text-sm bg-gray-50"></textarea></div>
                          <div className="flex justify-end pt-2"><button type="submit" disabled={isLoading} className="bg-emerald-600 text-white py-2 px-6 rounded-lg flex items-center gap-2 font-bold hover:bg-emerald-700 transition-colors"><PlusSquare className="w-5 h-5 flex-shrink-0"/> Save App</button></div>
                        </form>
                      </div>
                    </div>
                  )}

                </main>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Vision2App />);
    </script>
</body>
</html>
